# The prek hook config IS the lint gate: per-file at commit, tests at push, whole repo in CI.
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: local
    hooks:
      # language: system so hooks call the mise-managed binaries — versions live in
      # mise.toml only. Routed through `mise exec` because git invokes hooks outside
      # the activated environment, where `cargo` is whatever rustup happens to have.
      - id: cargo-fmt
        name: cargo fmt
        entry: mise exec -- cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: mise exec -- cargo clippy --all-targets --locked -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      # shell/init.zsh is zsh, not POSIX sh: shellcheck cannot parse it, so it is
      # covered by tests/shell.zsh (which runs it in a real zsh) instead.
      - id: zsh-syntax
        name: zsh -n (parse the emitted snippet and the suite)
        # Loop explicitly: `zsh -n a b` parses only `a` and turns `b` into a
        # positional parameter, so the plain form passes files it never read.
        entry: mise exec -- zsh -c 'for f in "$@"; do zsh -n "$f" || exit 1; done' --
        language: system
        files: '\.zsh$'
      - id: gitleaks
        name: gitleaks (staged)
        entry: mise exec -- gitleaks git --staged --redact --verbose
        language: system
        pass_filenames: false
      - id: tests
        name: tests (pre-push)
        entry: mise run test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
